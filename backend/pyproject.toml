[tool.poetry]
name = "net-est-backend"
version = "2.0.0"
description = "NET-EST Backend - Text Simplification Strategy Analysis"
authors = ["Wisley Vilela <wisley@example.com>", "NET-EST Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "0.115.5"
uvicorn = {extras = ["standard"], version = "0.34.0"}
pydantic = "2.10.5"
pydantic-settings = "2.7.0"
sentence-transformers = "3.3.1"
transformers = "4.47.1"
torch = "2.5.1"
spacy = "3.8.4"
textstat = "0.7.4"
scikit-learn = "1.6.1"
scipy = "1.14.1"
numpy = "2.2.1"
python-multipart = "0.0.20"
aiofiles = "24.1.0"
structlog = "24.4.0"
python-dotenv = "1.0.1"
pyyaml = "6.0.2"
redis = "5.2.1"
asyncpg = "0.30.0"
sqlalchemy = {extras = ["asyncio"], version = "2.0.36"}
alembic = "1.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.25.2"
pytest-cov = "6.0.0"
httpx = "0.28.1"
black = "24.10.0"
ruff = "0.8.4"
pyright = "1.1.389"

[tool.poetry.group.test.dependencies]
pytest-mock = "3.14.0"
faker = "33.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
indent-width = 4

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

# Ignore specific rules
ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules for test files
"tests/**/*.py" = [
    "D",    # Don't require docstrings in tests
    "S101", # Don't warn about assert usage in tests
]

# Ignore import rules for __init__.py files
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings
convention = "google"

[tool.ruff.lint.isort]
# Configure import sorting
known-first-party = ["src"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
# Configure code formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.isort]
# Import sorting configuration
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]
skip = ["venv", ".venv", "__pycache__"]

[tool.mypy]
# Type checking configuration
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can be made stricter later
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Per-module configuration
[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "sentence_transformers.*",
    "torch.*",
    "sklearn.*",
    "pdfplumber.*",
    "pypdf2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Test configuration
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]

[tool.coverage.run]
# Coverage configuration
source = ["src"]
omit = [
    "tests/*",
    "venv/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
# Coverage reporting
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
